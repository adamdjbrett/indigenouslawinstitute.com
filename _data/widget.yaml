# Info List Widget
info: 
  title: Our Work
  description: The Indigenous Law Institute assists American Indian and other Indigenous communities to work toward a future of restoration and healing.
  list: 
    - icon: fas fa-scroll
      title: Traditional Native Law
      text: The natural world wisdom of our ancestors still lives in the Kanaka Maoli Law, the Seven Laws of the Lakota, the Twelve Laws of the Shawnee, and the Laws of the Kogi. We advocate that traditional Native thought and culture be acknowledged as a necessary basis for our collective existence on Mother Earth. [Read more](/ili_info/#traditional-native-law)
    - icon: fas fa-scale-balanced
      title: The Empire-Domination Model
      text: We have identified U.S. federal Indian law as a language system of domination, traced from the 1493 papal bull *Inter Caetera* to the Supreme Court ruling in *Johnson v. M&rsquo;Intosh*, and we are developing a radically new basis for thinking about Native rights. [Read more](/ili_info/#the-empire-domination-model)
    - icon: fas fa-seedling
      title: Restoration and Healing
      text: Through Historical Unresolved Grief Seminars and the active retrieval of our languages, cultures, and traditions, our communities are assisted to work through generations of trauma and to recover a sovereign spiritual way of life. [Read more](/ili_info/#historical-unresolved-grief-seminars)

